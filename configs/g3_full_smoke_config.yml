# Borg FULL smoke: every path a long run touches, at ~15 minutes of compute.
#
# g3_smoke covers package -> schedule -> data -> fwd/bwd -> checkpoint. It
# leaves off exactly the parts that kept breaking stage-2 hours into a run:
# online eval, final eval, sampling and image logging. Each of those reads a
# different dataset root, and each failure so far surfaced only once training
# had run long enough to reach it -- so they belong in a smoke, not in a
# 57-hour job.
#
# What this adds over g3_smoke:
#   sample_per_step      -> exercises generate() and the KV cache dtype
#   log_vis_per_step     -> exercises the image writer and $CHECKPOINT_BUCKET/viz
#   online_eval_tasks    -> exercises the eval shard listing on CNS
#   final_eval_tasks     -> exercises the end-of-run eval path
#
# The eval lists and the stage-2 mix are the PRODUCTION ones from
# remote_run_config, not a reduced set. A smoke whose surface is narrower than
# the run it gates cannot gate it: the whole reason stage 2 failed one launch
# at a time was that each attempt only reached the next unexercised path.
# Every source and every benchmark is touched here, for 2 steps instead of
# 75000.
#
# Verdict is not "exit 0": check that $CHECKPOINT_BUCKET holds viz/ with PNGs
# and that the eval metrics appear in the log.
# It is deliberately a CURRICULUM config with stage2 present, because the
# stage-1 -> stage-2 boundary (a params-only restore with a fresh optimizer)
# is one of the two places a short run does not otherwise exercise.
#
# Everything not named here inherits configs/default.py.
model:
    arch: llava
    lm_backbone_str: "gemma3_1B"
    lm_checkpoint_variant: "it"

    vision_tower_str: "openai/clip-vit-large-patch14-336"
    vision_feature_layer: -2
    vision_select_feature: "patch"
    clip_input_format: "minus_one_to_one"

    projector_type: "mlp2x_gelu"
    projector_use_ln: False

    attn_logits_soft_cap: 0.0
    final_logit_softcap: 0.0
    txt_feature_layer: 0
    image_post_connector_scale: 1.0
    image_post_connector_transform: "fixed_scale"
    image_text_stat_source: "prompt"
    image_text_stat_axes: "scalar"
    prompt_causal: True
    recon_loss_weight: 0.0
    vlm_loss_weight: 1.0
    text_only_loss_weight: 0.0
    cfg_loss_weight: 0.0
    alpha: 0.0

dataset:
    image_size: 336
    max_txt_len: 160
    resize_mode: stretch
    # Small on purpose. absl_spawn re-execs the ~2.4 GB binary once per worker,
    # so a smoke run wants few workers; production stage 1 uses 16.
    num_workers: 2
    prefetch_factor: 2
    stateful_dataloader: True
    stateful_dataloader_strict: True
    # Production is 10000. Filling that buffer would read ~10k images before
    # the first batch and dominate a 10-step run.
    webdataset_shuffle_size: 256
    stateful_snapshot_every_n_steps: 5

training:
    curriculum: llava15_two_stage
    # 10 stage-1 steps, then 2 stage-2 steps: enough to cross the stage
    # boundary, which is a params-only restore onto a fresh optimizer and
    # therefore a different code path from the steps either side of it.
    stage1_steps: 10
    stage2_steps: 2
    num_steps: 12

    vision_tower_from_scratch: False
    clip_from_pt: True

    optimizer: adam
    grad_clip_norm: 1.0
    log_per_step: 1
    # Write a checkpoint mid-stage-1, so the smoke proves the checkpoint
    # transaction (dataloader state -> model -> sidecar finalize -> marker)
    # rather than only the final save.
    checkpoint_per_step: 5
    log_vis_per_step: 5
    online_eval_per_step: 5
    # The production lists, verbatim from remote_run_config's stage2. knn_full
    # and mmbench are IN: both were the reason a previous smoke passed while
    # the real run would have died at its final eval -- knn reads TFDS
    # ImageNet, mmbench a TSV that used to be fetched over HTTPS, and neither
    # is reachable on Borg by the code paths the GCP cluster used.
    online_eval_tasks: [vqav2, mme, textvqa, pope, refcocog, mmvp, vstar, ocrbench, countbenchqa]
    final_eval_tasks: [vqav2, mme, textvqa, pope, mmbench, knn_full, refcocog, mmvp, vstar, ocrbench, countbenchqa, gqa, seed_bench, cambrian_cvbench, vlms_are_blind, docvqa, realworldqa]
    lr_schedule: cos
    seed: 42

    stage1:
        name: "stage1_projector_pretrain"
        model:
            vlm_loss_weight: 1.0
            text_only_loss_weight: 0.0
            cfg_loss_weight: 0.0
            alpha: 0.0
        dataset:
            max_txt_len: 160
        dataset_items:
            - cc12m
        mix_weights: [1]
        # ONE EXAMPLE PER JAX DEVICE, and "device" is not "chip".
        #
        # `_validate_and_get_local_batch_size` requires
        # `batch_size % jax.device_count() == 0`, and on a v7-32 that count is
        # 64, not 32: the slice is 8 processes x 8 local devices, because these
        # chips expose TWO cores each (measured on XID 276999058 --
        # `JAX process: 0 / 8`, and its local device list runs id=0..7 with
        # core_on_chip alternating 0/1 over four coords). A chip count is not a
        # device count and neither is a mesh size; the only trustworthy source
        # is `jax.device_count()` on the actual slice.
        #
        # 16 was one-per-chip on a v5p-16 and would raise here
        # ("Global batch size 16 must be divisible by device_count=64") before
        # the first step -- a config error that costs a full schedule + 5 min
        # of imports to discover.
        batch_size: 64
        freeze_lm: True
        freeze_image_encoder: True
        optimizer: adam
        adam:
            learning_rate: 0.001
            adam_b2: 0.95
            weight_decay: 0.0
        vision_encoder_learning_rate: 0.00002
        connector_learning_rate: 0.001
        warmup_steps: 2
        lr_schedule: cos
        sample_per_step: 5
        online_eval_per_step: 5
        online_eval_tasks: [vqav2, mme]
        final_eval_tasks: []

    stage2:
        name: "stage2_visual_instruction_sft"
        model:
            vlm_loss_weight: 1.0
            text_only_loss_weight: 0.0
            cfg_loss_weight: 0.0
            alpha: 0.0
        dataset:
            # 512, as production. Sequence length sets the compiled shapes and
            # the memory high-water mark, so a smoke at 160 proves neither.
            max_txt_len: 512
            # Production uses 8. absl_spawn re-execs the ~2.4 GB binary per
            # worker, and 12 sources at 8 workers is the slow part of a 2-step
            # run -- 4 still fans out over the grouped loader.
            num_workers: 4
            # The grouped OV1.5 loader and its stationary mixture, verbatim
            # from remote_run_config: it fans one dataset_item out to ~34
            # sources, which is where the shard-root assembly that kept
            # producing gs:// paths on Borg actually lives.
            llava_ov15_min_shards_standalone: 64
            expand_conversations_at_fill: True
            llava_ov15_weight_basis: questions
            weighted_item_shuffle_size:
                enabled: True
                include_types: [llava_ov15]
                total: 131072
                min: 1024
                max: 262144
        # The production 12-source SFT mix, all of it now on CNS. Reusing
        # cc12m here (as this smoke first did) exercises the stage boundary but
        # NOT the twelve loaders, which is where every stage-2 failure was.
        dataset_items:
            - llava-ov-1.5-instruct-grouped
            - vqav2
            - okvqa-train
            - aokvqa-train
            - ocrvqa-train
            - gqa-train
            - visual-genome-det
            - refcoco-train
            - refcocog-train
            - pixmo-cap-qa
            - pixmo-count
            - openimages-relationship-train
        mix_weights: [1.0, 0.444, 0.009, 0.068, 0.802, 0.943, 0.86, 0.084, 0.084, 0.27, 0.036, 0.235245]
        dataset_mix_weight_power: 0.5
        # Same divisibility rule as stage 1; see the note there.
        batch_size: 64
        freeze_lm: False
        freeze_lm_embed: False
        freeze_lm_late: False
        freeze_image_encoder: True
        optimizer: adam
        adam:
            learning_rate: 0.000028
            adam_b2: 0.95
            weight_decay: 0.0
        vision_encoder_learning_rate: 0.000028
        connector_learning_rate: 0.0007
        warmup_steps: 1
        lr_schedule: cos
        sample_per_step: 1
        online_eval_per_step: 1
        online_eval_tasks: [vqav2, mme, textvqa, pope, refcocog, mmvp, vstar, ocrbench, countbenchqa]
        final_eval_tasks: [vqav2, mme, textvqa, pope, mmbench, knn_full, refcocog, mmvp, vstar, ocrbench, countbenchqa, gqa, seed_bench, cambrian_cvbench, vlms_are_blind, docvqa, realworldqa]

sampling:
    max_new_tokens: 16
    beam_size: 1

eval:
    # A smoke wants the code path, not the number: cap every population.
    #
    # `max_eval_steps` used to be the only thing here and NOTHING READS IT --
    # so this block asked for a cap and got full benchmarks.
    #
    # There are TWO cap mechanisms, and assuming one covers everything is how
    # the first widened smoke still ran six benchmarks at full size (45 min
    # instead of 15). `debug_max_samples` is read by eval_vqav2, textvqa,
    # pixelbench, mme, pope, refcocog and mmbench. The eval_vlm_benchmarks
    # family does NOT read it -- it takes `<benchmark>_num_samples`, whose
    # default is the full benchmark. Each key below was checked against its
    # reader.
    debug_max_samples: 64
    # Not covered by debug_max_samples: these have their own knobs.
    pixelbench_num_samples_per_benchmark: 32
    pope_num_samples_per_split: 32
    mmbench_max_samples: 32
    mme_num_samples: 64
    refcocog_num_samples: 32
    # KNN reads TFDS ImageNet, whose full pass is 1.28M train + 50k val. The
    # smoke proves the data_dir resolves and the pipeline runs; 2 images per
    # class over 1000 classes plus 512 val images does that in minutes.
    # eval_vlm_benchmarks' own knob, one per benchmark; defaults are the full
    # sets (12578 / 14233 / 2638 / 8016 / 5349 / 765).
    gqa_num_samples: 64
    seed_bench_num_samples: 64
    cambrian_cvbench_num_samples: 64
    vlms_are_blind_num_samples: 64
    docvqa_num_samples: 64
    realworldqa_num_samples: 64
    knn_full_images_per_class: 2
    knn_val_examples: 512
    knn_batch_size: 64
    device_batch_size: 4
    eval_recon_tokens: []

finetune: False
sharding: hsdp_legacy_data

load_from: ''
wandb_resume_id: ''

logging:
    # google3's wandb is a mock that stores nothing. Metrics go to Datatables
    # via utils/g3_metrics.py instead (http://flatboard/xid/<XID>).
    use_wandb: False
    wandb_project: "jax-llava"
    wandb_entity: ""
    wandb_tags: ["g3-smoke"]
    wandb_notes: "google3/Borg port smoke: 10 stage-1 steps + 2 stage-2 steps on cc12m from CNS."
