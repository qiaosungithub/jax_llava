model:
    arch: llava
    lm_backbone_str: "gemma3_1B"
    lm_checkpoint_variant: "it"

    vision_tower_str: "openai/clip-vit-large-patch14-336"
    vision_feature_layer: -2
    vision_select_feature: "patch"
    clip_input_format: "minus_one_to_one"

    projector_type: "mlp2x_gelu"
    projector_use_ln: False

    attn_logits_soft_cap: 0.0
    final_logit_softcap: 0.0
    txt_feature_layer: 0
    image_post_connector_scale: 1.0
    image_post_connector_transform: "fixed_scale"
    # image_post_connector_transform: "match_text_stats"
    image_text_stat_source: "prompt"
    image_text_stat_axes: "scalar"
    prompt_causal: True
    recon_loss_weight: 0.0
    vlm_loss_weight: 1.0
    text_only_loss_weight: 0.0
    cfg_loss_weight: 0.0
    alpha: 0.0

dataset:
    image_size: 336
    max_txt_len: 2048
    resize_mode: stretch
    # Default for stage1 (cc12m pretrain). stage2 (SFT with grouped OV1.5)
    # overrides num_workers to 8 in its dataset block (grouped OV1.5 fans out to
    # ~34 per-config sources; streams = sources x num_workers).
    num_workers: 16
    prefetch_factor: 4
    stateful_dataloader: True
    stateful_dataloader_strict: True
    # The OV1.5 grouped/stationary-mixture knobs (llava_ov15_min_shards_standalone,
    # expand_conversations_at_fill, llava_ov15_weight_basis, weighted_item_shuffle_size)
    # live in stage2's dataset block so they only affect the SFT stage.

training:
    curriculum: llava15_two_stage # train 2 stages together.

    # Global checkpoint stream in one workdir:
    # stage-1 [0, 2180), stage-2 [2180, 77180).
    stage1_steps: 2180
    # stage2_steps: 5195 # baseline
    # num_steps: 7375 # baseline
    # Half of beifen-Paligemma stage3's 150000 (wall-clock budget); warmup halved
    # with it to keep the same 10% warmup fraction.
    stage2_steps: 75000
    num_steps: 77180

    vision_tower_from_scratch: False
    clip_from_pt: True

    optimizer: adam
    grad_clip_norm: 1.0
    log_per_step: 100
    checkpoint_per_step: 800
    log_vis_per_step: -1
    online_eval_per_step: -1
    online_eval_tasks: []
    final_eval_tasks: []
    lr_schedule: cos
    seed: 42

    stage1:
        name: "stage1_projector_pretrain"
        model:
            # Keep projector pretraining as plain image-conditioned NTP.
            vlm_loss_weight: 1.0
            text_only_loss_weight: 0.0
            cfg_loss_weight: 0.0
            alpha: 0.0
        dataset:
            # max_txt_len: 64 # baseline
            max_txt_len: 160
        dataset_items:
            # - blip3o-short
            - cc12m
            # - laion-aes
        mix_weights: [1]
        batch_size: 256
        freeze_lm: True
        freeze_image_encoder: True
        optimizer: adam # TODO: ablate muon
        adam:
            learning_rate: 0.001
            adam_b2: 0.95
            weight_decay: 0.0
        vision_encoder_learning_rate: 0.00002
        connector_learning_rate: 0.001
        warmup_steps: 65
        lr_schedule: cos
        sample_per_step: -1
        # CLIP is frozen in stage 1, so ImageNet kNN cannot track training progress.
        online_eval_per_step: -1
        online_eval_tasks: []
        final_eval_tasks: []

    stage2:
        name: "stage2_visual_instruction_sft"
        model:
            # Enable CFG training only for SFT: VLM CE + text-only CE + CFG CE.
            vlm_loss_weight: 1.0
            text_only_loss_weight: 0.0
            cfg_loss_weight: 0.0
            alpha: 0.0
        dataset:
            max_txt_len: 512
            # grouped OV1.5 fans out to ~34 sources; fewer workers keeps streams sane.
            num_workers: 8
            # Grouped, stationary-mixture OV1.5 loader (removes valid-token drift):
            # per-config sources + expand-at-fill, weighted by QUESTION count
            # (OV1.5 grouped item weight 1.0 -> ~54 M QA), unit-consistent with the
            # M-of-QA weights of the other datasets.
            llava_ov15_min_shards_standalone: 64
            expand_conversations_at_fill: True
            llava_ov15_weight_basis: questions
            weighted_item_shuffle_size:
                enabled: True
                include_types: [llava_ov15]
                total: 131072
                min: 1024
                max: 262144
        dataset_items:
            # Aligned to beifen-Paligemma stage3 SFT mix (2026-07-24): dropped
            # tallyqa (Pali flags it "bad") and full visual-genome QA (Pali keeps
            # only vg-det); added pixmo-cap-qa + pixmo-count + the ported
            # openimages-relationship loader. Same 12 sources as beifen stage3.
            - llava-ov-1.5-instruct-grouped
            - vqav2
            - okvqa-train
            - aokvqa-train
            - ocrvqa-train
            - gqa-train
            - visual-genome-det
            - refcoco-train
            - refcocog-train
            - pixmo-cap-qa
            - pixmo-count
            - openimages-relationship-train
        # Weights = MILLIONS OF QA EXAMPLES, matched to beifen stage3. Order/counts
        # (M): OV1.5(~54), vqav2 0.444, okvqa 0.009, aokvqa 0.068, ocrvqa 0.802,
        # gqa 0.943, vg-det 0.86, refcoco 0.084 (doubled stream), refcocog 0.084,
        # pixmo-cap-qa 0.27, pixmo-count 0.036, OI-relationship 0.235245 (its
        # emitted structured-SPO count after ambiguity filtering + the 10% `at` cap).
        mix_weights: [1.0, 0.444, 0.009, 0.068, 0.802, 0.943, 0.86, 0.084, 0.084, 0.27, 0.036, 0.235245]
        # w -> w**0.5 per RESOLVED source (OV1.5 sub-sources powered individually),
        # flattening the mixture toward uniform. NOTE: beifen stage3 ran with this
        # OFF (commented out); 0.5 here is a deliberate jax deviation.
        dataset_mix_weight_power: 0.5
        # batch_size: 128 # baseline
        # batch_size: 512  # was: 4x, samples-matched at 50000 steps
        batch_size: 256  # beifen-Paligemma stage3 batch (bs 256 x 75000 steps = 19.2M samples)
        freeze_lm: False
        freeze_lm_embed: False
        freeze_lm_late: False
        freeze_image_encoder: True
        optimizer: adam
        # sqrt-scaled to bs 256 from this family's own ladder: bs 128 -> (2e-5,
        # 5e-4) and bs 512 -> (4e-5, 1e-3), i.e. batch x4 -> lr x2. bs 256 is the
        # geometric midpoint, so lr x sqrt(2). No bs-256 run existed before this.
        adam:
            # learning_rate: 0.00002 # baseline (bs 128)
            # learning_rate: 0.00004 # bs 512
            learning_rate: 0.000028
            adam_b2: 0.95
            weight_decay: 0.0
        # vision_encoder_learning_rate: 0.00002 # baseline (bs 128)
        # connector_learning_rate: 0.0005 # baseline (bs 128)
        # Moot while freeze_image_encoder=True; kept tracking the LM lr.
        vision_encoder_learning_rate: 0.000028
        connector_learning_rate: 0.0007

        # warmup_steps: 156 # baseline
        # beifen stage3 warmup 15000 / 150000 = 10%; halved with stage2_steps.
        warmup_steps: 7500
        lr_schedule: cos
        # sample_per_step: 200 # baseline
        # online_eval_per_step: 1200 # baseline
        sample_per_step: 2000
        online_eval_per_step: 5000
        # Same task lists as beifen-Paligemma stage3 / PaliGemma-baseline: the
        # `pixelbench` bundle is spelled out per benchmark (mmvp/vstar/ocrbench/
        # countbenchqa) so each gets its own sampler token budget.
        online_eval_tasks: [vqav2, mme, textvqa, pope, refcocog, mmvp, vstar, ocrbench, countbenchqa]
        final_eval_tasks: [vqav2, mme, textvqa, pope, mmbench, knn_full, refcocog, mmvp, vstar, ocrbench, countbenchqa, gqa, seed_bench, cambrian_cvbench, vlms_are_blind, docvqa, realworldqa]

sampling:
    max_new_tokens: 64
    beam_size: 1

eval:
    eval_recon_tokens: []
    device_batch_size: 32
    eval_tokens_default: 64
    eval_tokens_shortqa: 8
    eval_tokens_mid: 16
    eval_tokens_ocr: 32
    eval_tokens_refcoco: 32
    eval_tokens_pixelbench: 32
    eval_tokens_cambrian_cvbench: 8
    eval_tokens_vlms_are_blind: 32
    eval_tokens_docvqa: 32
    eval_tokens_realworldqa: 16
    eval_tokens_mmbench: 8
    online_vqav2_sample_fraction: 0.1
    vqav2_num_samples: 214354

finetune: False
sharding: hsdp_legacy_data

# Run this queue entry from scratch. Keep these empty so the run cannot restore
# an old checkpoint/dataloader state after monitor requeues it.
# Stage-2 starts from the reproduced stage-1 endpoint (loss ~1.444, acc ~0.630).
# This is the ORIGINAL in is-d (cbf), co-located with v7 compute in that metro.
# A tul copy also exists (nm-d/eqr_data/stage1_ckpt) for a v6p run there, but
# v6p is fleet-capped: the dynamic root pool reports a `ghostfish:46` deficit,
# which is a power/bonus-capacity ceiling above our alloc and does not clear by
# waiting -- 13 gang teardowns in 6.5 h. v7-32 in cbf has 3891 obtainable chips
# against v6p-64's 232 in tul.
#
# The step is read from the basename, and 2180 == training.stage1_steps, so the
# curriculum skips stage 1 and enters stage 2 with restore_mode='params_only'
# (fresh optimizer) -- the boundary the full smoke exercises.
#
# NOTE for a RESUME: drop this back to '' and use --resume_xid. Carrying
# load_from on every restart makes each attempt begin at 2180 again and then
# collide with the checkpoint the previous attempt already wrote.
load_from: '/cns/is-d/home/qiaos/eqr_data/logs/jax_llava/xid_277917081_20260807_195157_llava15-stage2-v13/pretrained-ckpts/checkpoint_2180'
wandb_resume_id: ''

logging:
    use_wandb: True
    wandb_project: "jax-llava"
    wandb_entity: "sqa24-massachusetts-institute-of-technology"
    wandb_tags: ["llava1.5", "curriculum", "hsdp"]
    wandb_notes: "[new dataset + dataloader] [stage 2 bs256 75000 steps, llava-fusion] llava-1.5 reproduction. Stage-1 trains connector only with CFG disabled; stage-2 trains connector + LM with VLM CE loss only (text-only/CFG off, alpha=0), image encoder frozen (original LLaVA-1.5 recipe). Adam LR: stage1 connector 1e-3, stage2 LM 2.8e-5, connector 7e-4 (sqrt-scaled to bs 256 from the bs128 2e-5/5e-4 and bs512 4e-5/1e-3 anchors), warmup 7500 (10%), cos. Stage-2 data aligned to beifen-Paligemma stage3 SFT mix: LLaVA-OV1.5-Instruct(grouped) + VQAv2/OKVQA/A-OKVQA/OCRVQA/GQA/VG-det/RefCOCO/RefCOCOg/PixMo-cap-qa/PixMo-count/OpenImages-relationship (12 sources, same as beifen stage3), dataset_mix_weight_power 0.5."
