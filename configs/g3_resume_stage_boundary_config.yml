# Borg RESUME probe B: STAGE-BOUNDARY resume (params-only restore).
#
# The other half of the resume surface. vlm_training.md: a same-stage resume
# restores FULL state, whereas a stage transition is PARAMS-ONLY with a fresh
# optimizer -- two different code paths, and a run that only proves one has
# not proven resume.
#
# stage1_steps is extended from 10 to 12 so that the restored checkpoint_12
# sits EXACTLY on the boundary:
#   current_step == stage1_steps  ->  stage 1 is skipped, and stage 2 is
#   entered with restore_mode='params_only' (train.py:1359) and
#   params_source=None. That last part is what makes this probe worth running:
#   params_for_next is only populated when stage 1 actually ran in-process, so
#   here the params must be READ BACK OFF CNS by restore_checkpoint_params,
#   through the durable pretrained-path fallback. The optimizer is
#   reinitialised and the global step asserted at 12.
#
# stage2 stays at 2 steps -> total 14. ACCEPTANCE IS STEP PROGRESS: the phase
# must start at 12 and reach 14.
#
# Everything not named here inherits configs/default.py.
model:
    arch: llava
    lm_backbone_str: "gemma3_1B"
    lm_checkpoint_variant: "it"

    vision_tower_str: "openai/clip-vit-large-patch14-336"
    vision_feature_layer: -2
    vision_select_feature: "patch"
    clip_input_format: "minus_one_to_one"

    projector_type: "mlp2x_gelu"
    projector_use_ln: False

    attn_logits_soft_cap: 0.0
    final_logit_softcap: 0.0
    txt_feature_layer: 0
    image_post_connector_scale: 1.0
    image_post_connector_transform: "fixed_scale"
    image_text_stat_source: "prompt"
    image_text_stat_axes: "scalar"
    prompt_causal: True
    recon_loss_weight: 0.0
    vlm_loss_weight: 1.0
    text_only_loss_weight: 0.0
    cfg_loss_weight: 0.0
    alpha: 0.0

dataset:
    image_size: 336
    max_txt_len: 160
    resize_mode: stretch
    # Small on purpose. absl_spawn re-execs the ~2.4 GB binary once per worker,
    # so a smoke run wants few workers; production stage 1 uses 16.
    num_workers: 2
    prefetch_factor: 2
    stateful_dataloader: True
    stateful_dataloader_strict: True
    # Production is 10000. Filling that buffer would read ~10k images before
    # the first batch and dominate a 10-step run.
    webdataset_shuffle_size: 256
    stateful_snapshot_every_n_steps: 5

training:
    curriculum: llava15_two_stage
    # 10 stage-1 steps, then 2 stage-2 steps: enough to cross the stage
    # boundary, which is a params-only restore onto a fresh optimizer and
    # therefore a different code path from the steps either side of it.
    stage1_steps: 12
    stage2_steps: 2
    num_steps: 14

    vision_tower_from_scratch: False
    clip_from_pt: True

    optimizer: adam
    grad_clip_norm: 1.0
    log_per_step: 1
    # Write a checkpoint mid-stage-1, so the smoke proves the checkpoint
    # transaction (dataloader state -> model -> sidecar finalize -> marker)
    # rather than only the final save.
    checkpoint_per_step: 1
    log_vis_per_step: -1
    online_eval_per_step: -1
    online_eval_tasks: []
    final_eval_tasks: []
    lr_schedule: cos
    seed: 42

    stage1:
        name: "stage1_projector_pretrain"
        model:
            vlm_loss_weight: 1.0
            text_only_loss_weight: 0.0
            cfg_loss_weight: 0.0
            alpha: 0.0
        dataset:
            max_txt_len: 160
        dataset_items:
            - cc12m
        mix_weights: [1]
        # ONE EXAMPLE PER JAX DEVICE, and "device" is not "chip".
        #
        # `_validate_and_get_local_batch_size` requires
        # `batch_size % jax.device_count() == 0`, and on a v7-32 that count is
        # 64, not 32: the slice is 8 processes x 8 local devices, because these
        # chips expose TWO cores each (measured on XID 276999058 --
        # `JAX process: 0 / 8`, and its local device list runs id=0..7 with
        # core_on_chip alternating 0/1 over four coords). A chip count is not a
        # device count and neither is a mesh size; the only trustworthy source
        # is `jax.device_count()` on the actual slice.
        #
        # 16 was one-per-chip on a v5p-16 and would raise here
        # ("Global batch size 16 must be divisible by device_count=64") before
        # the first step -- a config error that costs a full schedule + 5 min
        # of imports to discover.
        batch_size: 64
        freeze_lm: True
        freeze_image_encoder: True
        optimizer: adam
        adam:
            learning_rate: 0.001
            adam_b2: 0.95
            weight_decay: 0.0
        vision_encoder_learning_rate: 0.00002
        connector_learning_rate: 0.001
        warmup_steps: 2
        lr_schedule: cos
        sample_per_step: -1
        online_eval_per_step: -1
        online_eval_tasks: []
        final_eval_tasks: []

    stage2:
        name: "stage2_visual_instruction_sft"
        model:
            vlm_loss_weight: 1.0
            text_only_loss_weight: 0.0
            cfg_loss_weight: 0.0
            alpha: 0.0
        dataset:
            max_txt_len: 160
            num_workers: 2
        # Stage 2's real mix is 12 sources that are NOT on CNS yet. The smoke
        # reuses cc12m so the boundary transition itself can be tested without
        # blocking on a data copy; it is not a meaningful stage-2 recipe.
        dataset_items:
            - cc12m
        mix_weights: [1.0]
        # Same divisibility rule as stage 1; see the note there.
        batch_size: 64
        freeze_lm: False
        freeze_lm_embed: False
        freeze_lm_late: False
        freeze_image_encoder: True
        optimizer: adam
        adam:
            learning_rate: 0.000028
            adam_b2: 0.95
            weight_decay: 0.0
        vision_encoder_learning_rate: 0.000028
        connector_learning_rate: 0.0007
        warmup_steps: 1
        lr_schedule: cos
        sample_per_step: -1
        online_eval_per_step: -1
        online_eval_tasks: []
        final_eval_tasks: []

sampling:
    max_new_tokens: 16
    beam_size: 1

eval:
    eval_recon_tokens: []
    device_batch_size: 4

finetune: False
sharding: hsdp_legacy_data

load_from: ''
wandb_resume_id: ''

logging:
    # google3's wandb is a mock that stores nothing. Metrics go to Datatables
    # via utils/g3_metrics.py instead (http://flatboard/xid/<XID>).
    use_wandb: False
    wandb_project: "jax-llava"
    wandb_entity: ""
    wandb_tags: ["g3-resume"]
    wandb_notes: "Resume probe B: stage-boundary (params-only) resume from checkpoint_12; stage1 extended 10->12."
